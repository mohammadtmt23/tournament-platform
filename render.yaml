# Render Blueprint: API (Docker) + static frontend.
# The database is a free Neon Postgres (Render's free Postgres expires after 30 days),
# so DATABASE_URL is entered by hand when the Blueprint is applied.
services:
  - type: web
    name: traore-tournament-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: traore-tournament-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
