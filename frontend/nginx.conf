server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward /api/* to the FastAPI container (prefix stripped).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
